# Chama o vigia das auditorias de habilitação a cada ~5 minutos (a Vercel no plano gratuito só permite 1 execução por dia
# em cron nativo; o vercel.json mantém uma execução diária de segurança). Para ativar: no GitHub, em
# Settings → Secrets and variables → Actions, crie os segredos APP_URL (ex.: https://www.bidd.ia.br) e CRON_SECRET
# (o mesmo valor da variável CRON_SECRET na Vercel). Sem os segredos, o fluxo não faz nada.
name: Vigia das auditorias

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Chamar o vigia
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Segredos APP_URL e CRON_SECRET não configurados — nada a fazer."
            exit 0
          fi
          curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/vigia-auditorias"
